<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>book-match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf6f0;
      --surface: #ffffff;
      --ink: #2b2320;
      --muted: #7a6f66;
      --accent: #7c2d40;
      --accent-soft: #f3e3e6;
      --line: #e6ddd2;
      --good: #2f7a4f;
      --good-bg: #e5f2ea;
      --bad: #b3532c;
      --bad-bg: #fbe9e0;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1613;
        --surface: #262019;
        --ink: #f0e9e2;
        --muted: #ab9f92;
        --accent: #e8a0ae;
        --accent-soft: #3a2530;
        --line: #3a3128;
        --good: #7fd3a1;
        --good-bg: #16301f;
        --bad: #e8a075;
        --bad-bg: #3a2216;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 32px 20px;
    }

    main {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 32px 28px 28px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px -16px rgba(43, 35, 32, 0.18);
    }

    .eyebrow {
      font-size: 11.5px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin: 0 0 4px;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 30px;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    .sub {
      color: var(--muted);
      font-size: 13.5px;
      margin: 0 0 26px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 6px;
    }

    .field {
      margin-bottom: 16px;
    }

    select,
    input[type="number"] {
      width: 100%;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      transition: border-color .15s ease;
    }

    select:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .toggle-row span {
      font-size: 14.5px;
    }

    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex: none;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      top: 3px;
      background: var(--surface);
      border-radius: 50%;
      transition: transform .15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    .switch input:checked+.slider {
      background: var(--accent);
    }

    .switch input:checked+.slider::before {
      transform: translateX(18px);
    }

    button.submit {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: var(--surface);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s ease, transform .05s ease;
    }

    button.submit:hover {
      opacity: 0.92;
    }

    button.submit:active {
      transform: scale(0.99);
    }

    button.submit:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #result {
      margin-top: 22px;
    }

    #result[hidden] {
      display: none !important;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .badge.good {
      background: var(--good-bg);
      color: var(--good);
    }

    .badge.bad {
      background: var(--bad-bg);
      color: var(--bad);
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .bar-track {
      flex: 1;
      height: 8px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width .4s ease;
    }

    .bar-pct {
      font-variant-numeric: tabular-nums;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      min-width: 36px;
      text-align: right;
    }

    .begruendung {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
    }

    .error {
      color: var(--bad);
      font-size: 13px;
      margin-top: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">book-match</p>
    <h1>Gefällt mir das?</h1>
    <p class="sub">Gib die Eckdaten eines Buchs ein &mdash; die API schätzt, ob es zu meinem Lesegeschmack passt.</p>

    <form id="form">
      <div class="field">
        <label for="genre">Genre</label>
        <select id="genre" required>
          <option value="Thriller">Thriller</option>
          <option value="Romance">Romance</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Sachbuch">Sachbuch</option>
          <option value="Sonstiges">Sonstiges</option>
        </select>
      </div>

      <div class="field">
        <label for="seitenzahl">Seitenzahl</label>
        <input type="number" id="seitenzahl" min="1" value="350" required>
      </div>

      <div class="field">
        <label for="erscheinungsjahr">Erscheinungsjahr</label>
        <input type="number" id="erscheinungsjahr" min="1900" max="2030" value="2024" required>
      </div>

      <div class="field">
        <div class="toggle-row">
          <span>Autor*in bereits bekannt</span>
          <label class="switch">
            <input type="checkbox" id="autor_bekannt" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <button type="submit" class="submit" id="submitBtn">Buch checken</button>
    </form>

    <div id="result" hidden>
      <span class="badge" id="badge"></span>
      <div class="bar-row">
        <div class="bar-track">
          <div class="bar-fill" id="barFill"></div>
        </div>
        <span class="bar-pct" id="barPct"></span>
      </div>
      <p class="begruendung" id="begruendung"></p>
    </div>

    <p class="error" id="error" hidden></p>
  </main>

  <script>
    (function () {
      "use strict";
      var form = document.getElementById("form");
      var submitBtn = document.getElementById("submitBtn");
      var result = document.getElementById("result");
      var errorEl = document.getElementById("error");
      var badge = document.getElementById("badge");
      var barFill = document.getElementById("barFill");
      var barPct = document.getElementById("barPct");
      var begruendungEl = document.getElementById("begruendung");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errorEl.hidden = true;
        result.hidden = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "Prüfe …";

        var payload = {
          genre: document.getElementById("genre").value,
          seitenzahl: parseInt(document.getElementById("seitenzahl").value, 10),
          erscheinungsjahr: parseInt(document.getElementById("erscheinungsjahr").value, 10),
          autor_bekannt: document.getElementById("autor_bekannt").checked
        };

        fetch("/buch-check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
          .then(function (res) {
            if (!res.ok) throw new Error("API-Fehler (" + res.status + ")");
            return res.json();
          })
          .then(function (data) {
            var pct = Math.round(data.gefaellt_mir_wahrscheinlichkeit * 100);
            var isGood = data.gefaellt_mir_wahrscheinlichkeit >= 0.5;

            badge.textContent = data.einschaetzung;
            badge.className = "badge " + (isGood ? "good" : "bad");
            barFill.style.width = pct + "%";
            barFill.style.background = isGood ? "var(--good)" : "var(--bad)";
            barPct.textContent = pct + "%";
            begruendungEl.textContent = data.begruendung;

            result.hidden = false;
          })
          .catch(function (err) {
            errorEl.textContent = "Konnte die API nicht erreichen. Läuft der Server (uvicorn main:app --reload)? " + err.message;
            errorEl.hidden = false;
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = "Buch checken";
          });
      });
    })();
  </script>
</body>

</html>
